{% extends 'base.html' %}{% block title %}Каталог — КубКубыч{% endblock %}
{% block content %}
<section class="section">
    <div class="container">
        <div class="section__header" style="text-align:left">
            <span class="eyebrow">24 набора · 8 серий</span>
            <h1>Каталог конструкторов</h1>
            <p>Выберите серию, возраст строителя и подходящий бюджет.</p>
        </div>

        <div class="catalog-toolbar">
            <input id="search" class="search-input" placeholder="Название, артикул или описание">
            <select id="category" class="form-control"><option value="">Все серии</option></select>
            <input id="min_price" class="form-control" type="number" min="0" placeholder="Цена от">
            <input id="max_price" class="form-control" type="number" min="0" placeholder="Цена до">
            <select id="availability" class="form-control"><option value="">Любое наличие</option><option value="true">В наличии</option></select>
            <select id="discount" class="form-control"><option value="">Все наборы</option><option value="true">Со скидкой</option></select>
            <select id="sort" class="form-control">
                <option value="name">По названию</option>
                <option value="price">Сначала дешевле</option>
                <option value="-price">Сначала дороже</option>
                <option value="-average_rating">По рейтингу</option>
                <option value="-sold_units">По популярности</option>
                <option value="-created_at">Сначала новые</option>
            </select>
            <button id="find" class="btn btn--green">Показать</button>
        </div>

        <p class="catalog-count" id="count"></p>
        <div class="cards-grid" id="products"><div class="loading"><div class="spinner"></div>Загружаем каталог…</div></div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
const $ = (id) => document.getElementById(id);

async function loadCategories() {
    const data = await API.get('/categories/') || [];
    const list = data.results || data;
    list.forEach(c => $('category').insertAdjacentHTML('beforeend', `<option value="${c.id}">${esc(c.name)}</option>`));
}

async function loadProducts() {
    const params = new URLSearchParams({ ordering: $('sort').value });
    if ($('search').value) params.set('search', $('search').value);
    if ($('category').value) params.set('category', $('category').value);
    if ($('min_price').value) params.set('min_price', $('min_price').value);
    if ($('max_price').value) params.set('max_price', $('max_price').value);
    if ($('availability').value) params.set('in_stock', 'true');
    if ($('discount').value) params.set('has_discount', 'true');

    const data = await API.get('/products/?' + params) || {};
    const list = data.results || [];
    $('count').textContent = `Найдено наборов: ${data.count ?? list.length}`;
    $('products').innerHTML = list.length
        ? list.map(productCard).join('')
        : '<div class="empty-state"><h3>Ничего не найдено</h3><p>Измените условия фильтра или сбросьте поиск.</p></div>';
}

$('find').onclick = loadProducts;
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') loadProducts(); });
['category', 'availability', 'discount', 'sort'].forEach(id => $(id).addEventListener('change', loadProducts));
loadCategories().then(loadProducts);
</script>
{% endblock %}
