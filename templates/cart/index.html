{% extends 'base.html' %}{% block content %}<section class="section"><div class="container"><h1>Корзина</h1><div id="cart">Загрузка…</div></div></section>{% endblock %}{% block extra_js %}<script>Promise.all([API.get('/cart/items/'),API.get('/cart/summary/')]).then(([items,summary])=>{const box=document.getElementById('cart');if(!items){box.innerHTML='<p>Войдите, чтобы увидеть корзину.</p>';return}if(!items.length){box.innerHTML='<div class="empty-state"><h3>Корзина пуста</h3><p>Загляните в каталог и выберите набор.</p><a class="btn btn--green" href="/catalog/">В каталог</a></div>';return}box.innerHTML=items.map(i=>`<p><b>${i.product_detail.name}</b> — ${i.quantity} шт. — ${i.line_total} ₽</p>`).join('')+`<h2>Итого: ${summary?summary.total:''} ₽</h2><a class="btn btn--green" href="/checkout/">Оформить</a>`})</script>{% endblock %}
