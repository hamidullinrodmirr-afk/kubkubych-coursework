{% extends 'base.html' %}{% block title %}Корзина — КубКубыч{% endblock %}
{% block content %}
<section class="section">
    <div class="container">
        <h1 class="section-title">Корзина</h1>
        <div id="cart"><div class="loading"><div class="spinner"></div>Загружаем корзину…</div></div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
const box = document.getElementById('cart');

function row(item) {
    const p = item.product_detail;
    return `<div class="cart-row" data-id="${item.id}">
        <img class="cart-row__image" src="${esc(p.image_url)}" alt="${esc(p.name)}">
        <div class="cart-row__info">
            <a class="cart-row__title" href="/products/${esc(p.slug)}/">${esc(p.name)}</a>
            <span class="cart-row__meta">${esc(p.article)} · ${formatPrice(p.final_price)} за шт.</span>
        </div>
        <div class="cart-qty">
            <button onclick="changeQty(${item.id}, ${item.quantity - 1})" ${item.quantity <= 1 ? 'disabled' : ''}>−</button>
            <span>${item.quantity}</span>
            <button onclick="changeQty(${item.id}, ${item.quantity + 1})">+</button>
        </div>
        <div class="cart-row__total">${formatPrice(item.line_total)}</div>
        <button class="cart-row__remove" title="Удалить" onclick="removeItem(${item.id})">×</button>
    </div>`;
}

async function render() {
    const [items, summary] = await Promise.all([API.get('/cart/items/'), API.get('/cart/summary/')]);
    if (!items) {
        box.innerHTML = '<div class="empty-state"><h3>Войдите в аккаунт</h3><p>Корзина доступна авторизованным покупателям.</p><a class="btn btn--green" href="/login/">Войти</a></div>';
        return;
    }
    if (!items.length) {
        box.innerHTML = '<div class="empty-state"><h3>Корзина пуста</h3><p>Загляните в каталог и выберите набор.</p><a class="btn btn--green" href="/catalog/">В каталог</a></div>';
        return;
    }
    box.innerHTML = `
        <div class="cart-list">${items.map(row).join('')}</div>
        <div class="cart-summary">
            <div class="cart-summary__total"><span>Итого</span><b>${formatPrice(summary.total)}</b></div>
            <div class="cart-summary__actions">
                <button class="btn btn--outline" onclick="clearCart()">Очистить</button>
                <a class="btn btn--green" href="/checkout/">Оформить заказ</a>
            </div>
        </div>`;
}

async function changeQty(id, quantity) {
    if (quantity < 1) return;
    const response = await API.patch(`/cart/items/${id}/`, { quantity });
    if (response && response.ok) render();
    else showAlert(document.body, await readError(response, 'Нельзя добавить больше, чем есть на складе'), 'error');
}

async function removeItem(id) {
    await API.delete(`/cart/items/${id}/`);
    render();
}

async function clearCart() {
    await API.delete('/cart/clear/');
    render();
}

render();
</script>
{% endblock %}
