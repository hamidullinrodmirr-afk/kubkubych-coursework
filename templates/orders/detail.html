{% extends 'base.html' %}
{% block title %}Заказ — КубКубыч{% endblock %}
{% block content %}
<section class="section">
    <div class="container order-detail" id="orderDetail"><div class="loading"><div class="spinner"></div>Загружаем заказ…</div></div>
</section>
{% endblock %}
{% block extra_js %}
<script>
const orderId = "{{ order_id }}";

function itemRow(item, delivered) {
    const reviewLink = delivered
        ? `<a class="order-item__review" href="/products/${esc(item.product_slug)}/">Оставить отзыв</a>`
        : '';
    return `<article class="order-item">
        <div><b>${esc(item.product_name)}</b><span>Артикул ${esc(item.product_article)} · ${item.quantity} шт. × ${formatPrice(item.unit_price)}</span>${reviewLink}</div>
        <strong>${formatPrice(item.line_total)}</strong>
    </article>`;
}

async function render() {
    const order = await API.get(`/orders/${orderId}/`);
    const root = document.getElementById('orderDetail');
    if (!order) {
        root.innerHTML = '<div class="empty-state"><h2>Заказ не найден</h2><p>Возможно, он принадлежит другому аккаунту.</p><a class="btn btn--green" href="/orders/">Мои заказы</a></div>';
        return;
    }
    const delivered = order.status === 'delivered';
    const cancelBtn = order.can_cancel
        ? `<button class="btn btn--outline" id="cancelBtn">Отменить заказ</button>` : '';
    root.innerHTML = `
        <a class="back-link" href="/orders/">← Все заказы</a>
        <div class="order-detail__header">
            <div><span class="eyebrow">${esc(order.order_number)}</span><h1>Детали заказа</h1>
                <p>Оформлен ${formatDate(order.created_at)}</p></div>
            <span class="order-status order-status--large status-badge--${order.status}">${esc(order.status_display)}</span>
        </div>
        <div class="order-detail__grid">
            <div class="order-detail__items">
                <h2>Состав заказа</h2>
                ${order.items.map(i => itemRow(i, delivered)).join('')}
                <div class="order-total"><span>Итого</span><b>${formatPrice(order.total)}</b></div>
                <div style="margin-top:18px">${cancelBtn}</div>
            </div>
            <aside class="order-detail__info">
                <h3>Доставка</h3>
                <p><b>Получатель</b><span>${esc(order.recipient_name)}</span></p>
                <p><b>Телефон</b><span>${esc(order.recipient_phone)}</span></p>
                <p><b>Адрес</b><span>${esc(order.delivery_address)}</span></p>
                <p><b>Оплата</b><span>${esc(order.payment_display)}</span></p>
                ${order.comment ? `<p><b>Комментарий</b><span>${esc(order.comment)}</span></p>` : ''}
            </aside>
        </div>`;
    const btn = document.getElementById('cancelBtn');
    if (btn) btn.onclick = async () => {
        const response = await API.post(`/orders/${orderId}/cancel/`, {});
        if (response && response.ok) { showAlert(document.body, 'Заказ отменён', 'success'); render(); }
        else showAlert(document.body, await readError(response, 'Не удалось отменить заказ'), 'error');
    };
}
render();
</script>
{% endblock %}
